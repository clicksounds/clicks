<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Sounds: Install Packs Guide</title>
    <link rel="icon" href="./.images/favicon.png" type="image/png">
    <meta property="og:title" content="Click Sounds: Install Packs Guide">
    <meta property="og:description" content="A guide to installing click packs for Click Sounds Full">
    <meta property="og:image" content="https://raw.githubusercontent.com/clicksounds/clicks/refs/heads/main/.images/fullres-logo.png">
    <meta property="og:url" content="https://clicksounds.xyz/cspihelp.html">
    <meta property="og:type" content="website">
    <script src="/.navbar/navbarFetch.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2 {
            color: #85ccf5;
        }

        h1 {
            text-align: center;
            margin-top: 100px;
            font-size: 2.5em;
        }

        h2 {
            margin-bottom: 0px;
            margin-top: 0px;
        }

        .code-inline {
            background: #1f1f30;
            color: #f5f5f5;
            font-family: monospace;
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }

        img {
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.58);
        }

        section {
            background-color: #2a2a3d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        a:visited {
            color: #00aaff;
        }

        .footnote {
            color: #999999;
            margin-top: 0px;
            display: block;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            background-color: #3a3a50;
            color: #fff;
        }

        input[type="radio"] {
            margin-right: 5px;
            display: inline-block;
        }

        label[for="typeUseful"],
        label[for="typeMeme"] {
            display: inline-block;
            margin-right: 10px;
        }

        input[type="file"] {
            border: 2px dashed #85ccf5;
            text-align: center;
            margin-top: 12px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background-color: #555;
            color: #1e1e2f;
            font-size: 1rem;
            cursor: not-allowed;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #6ea7c7;
        }

        button:enabled {
            background-color: #6ee873;
            cursor: pointer;
        }

        button:enabled:hover {
            background-color: #4abf5f;
            transform: translateY(-2px);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #3a3a50;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }

        p {
            font-size: 0.9rem;
        }

        br {
            display: block;
            line-height: 1;
        }

        @media (max-width: 600px) {
            section {
                margin: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
	<div id="navbar"></div>

    <h1>Click Sounds Full: Install Packs</h1>

	<section>
		<h2>This guide was outdated.</h2>
		<label>Remind me to rewrite it later?</label>
		<br>
		<label>Here's a basic version: Have a <span class="code-inline">.packgen.zip</span> click pack file you want to install. Start a level. Pause it. Open the Click Sounds menu. Press the green (+) icon. Press continue. Select the <span class="code-inline">.packgen.zip</span> file. Now the pack will show up in the Click Sounds Index menu, but only on your device.</label>
	</section>
</body>
</html>
